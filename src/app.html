<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Multi-college education ERP for admissions, academics, attendance, examinations, fees, HR, library, inventory, and more." />
		<meta name="color-scheme" content="light dark" />
		<title>College ERP</title>
		<script>
			try {
				var saved = localStorage.getItem('erp-theme');
				var theme =
					saved === 'dark' || saved === 'light'
						? saved
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				/* ignore */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
